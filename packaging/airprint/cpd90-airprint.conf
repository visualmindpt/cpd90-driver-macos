# Atributos do servidor AirPrint da CP-D90 (ippeveprinter -a).
# Validado com o iPhone em 2026-09-29: tamanhos 4x6" e 6x8" sem margens,
# só cor sRGB a 300 ppp (com o cinzento disponível, o iOS escolhia W8).
ATTR text printer-make-and-model "Mitsubishi CP-D90DW"
ATTR keyword printer-kind photo
ATTR boolean color-supported true
ATTR keyword print-color-mode-supported color
ATTR keyword print-color-mode-default color
ATTR resolution printer-resolution-supported 300dpi
ATTR resolution printer-resolution-default 300dpi
ATTR resolution pwg-raster-document-resolution-supported 300dpi
ATTR keyword pwg-raster-document-type-supported srgb_8
ATTR keyword urf-supported V1.4,CP1,RS300,SRGB24
ATTR enum print-quality-supported 5
ATTR enum print-quality-default 5
ATTR keyword media-supported na_index-4x6_4x6in,oe_photo-6x8_6x8in
ATTR keyword media-default oe_photo-6x8_6x8in
ATTR keyword media-ready na_index-4x6_4x6in,oe_photo-6x8_6x8in
ATTR keyword media-source-supported auto
ATTR keyword media-type-supported photographic-glossy
ATTR integer media-bottom-margin-supported 0
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0
ATTR integer media-top-margin-supported 0
ATTR collection media-size-supported {MEMBER integer x-dimension 10160 MEMBER integer y-dimension 15240},{MEMBER integer x-dimension 15240 MEMBER integer y-dimension 20320}
ATTR collection media-col-database {MEMBER collection media-size {MEMBER integer x-dimension 10160 MEMBER integer y-dimension 15240} MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source auto MEMBER keyword media-type photographic-glossy},{MEMBER collection media-size {MEMBER integer x-dimension 15240 MEMBER integer y-dimension 20320} MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source auto MEMBER keyword media-type photographic-glossy}
ATTR collection media-col-ready {MEMBER collection media-size {MEMBER integer x-dimension 10160 MEMBER integer y-dimension 15240} MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source auto MEMBER keyword media-type photographic-glossy},{MEMBER collection media-size {MEMBER integer x-dimension 15240 MEMBER integer y-dimension 20320} MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source auto MEMBER keyword media-type photographic-glossy}
ATTR collection media-col-default {MEMBER collection media-size {MEMBER integer x-dimension 15240 MEMBER integer y-dimension 20320} MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0 MEMBER keyword media-source auto MEMBER keyword media-type photographic-glossy}
